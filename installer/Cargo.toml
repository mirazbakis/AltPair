[package]
name = "altpair"
version = "0.1.1"
edition = "2021"
description = "Installs AltLoad onto the iPhone it runs on, from a Linux shell, signed with your own Apple ID"
publish = false

# A workspace of its own, so it builds apart from the iOS core.
[workspace]

[[bin]]
name = "altpair"
path = "src/main.rs"

[dependencies]
# AltLoad's Rust core: Apple ID sign-in, tunnel to this iPhone, signing, install.
# Pinned to an AltLoad commit; change `rev` to move to a newer core.
altload_ffi = { git = "https://github.com/mirazbakis/AltLoad", rev = "2f5f20a55e7cdb30ec28d9a335369796e77794a1" }
libc = "0.2"
plist = "1.8"
serde_json = "1"
# The same TLS stack the core uses (rustls with ring, no OpenSSL).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["rt", "net", "time", "macros"] }

# Patches are not inherited from a dependency, so the core's idevice pin is repeated here.
[patch.crates-io]
idevice = { git = "https://github.com/jkcoxson/idevice.git", rev = "2dca9a58a9a1dd02ec7d6213fcfd8fe861e74132" }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
